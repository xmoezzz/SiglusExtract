name: SiglusExtract Windows CI v3 no installer

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release Win32
    runs-on: windows-2022

    env:
      SOLUTION_PATH: source/SiglusExtract/SiglusExtract.sln
      CONFIGURATION: Release
      PLATFORM: Win32
      PLATFORM_TOOLSET: v143

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Inspect Visual Studio and select Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path $env:SOLUTION_PATH)) {
            throw "Solution was not found: $env:SOLUTION_PATH"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found: $vswhere"
          }

          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installPath) {
            throw 'No Visual Studio installation with MSBuild was found.'
          }
          Write-Host "Visual Studio installation: $installPath"

          $vcToolsRoot = Join-Path $installPath 'VC\Tools\MSVC'
          if (-not (Test-Path $vcToolsRoot)) {
            throw "MSVC tools directory was not found: $vcToolsRoot"
          }

          $msvc = Get-ChildItem $vcToolsRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $msvc) {
            throw "No MSVC toolset was found under: $vcToolsRoot"
          }
          Write-Host "Selected MSVC: $($msvc.Name)"
          Write-Host "MSVC path: $($msvc.FullName)"

          $mfcLib = Join-Path $msvc.FullName 'atlmfc\lib\x86\nafxcw.lib'
          if (-not (Test-Path $mfcLib)) {
            throw "Static MFC x86 library was not found: $mfcLib"
          }
          Write-Host "Static MFC x86 library found: $mfcLib"

          $kitsInclude = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          if (-not (Test-Path $kitsInclude)) {
            throw "Windows Kits include directory was not found: $kitsInclude"
          }

          $installedSdks = Get-ChildItem $kitsInclude -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'um\Windows.h') } |
            ForEach-Object { $_.Name } |
            Sort-Object

          if (-not $installedSdks) {
            throw "No usable Windows SDK include directories were found under: $kitsInclude"
          }

          Write-Host 'Installed Windows SDKs:'
          $installedSdks | ForEach-Object { Write-Host "  $_" }

          $preferredSdks = @(
            '10.0.17763.0',
            '10.0.19041.0',
            '10.0.22621.0',
            '10.0.26100.0'
          )

          $selectedSdk = $preferredSdks | Where-Object { $installedSdks -contains $_ } | Select-Object -First 1
          if (-not $selectedSdk) {
            $selectedSdk = $installedSdks | Sort-Object {[version]$_} -Descending | Select-Object -First 1
          }

          Write-Host "Selected Windows SDK: $selectedSdk"
          "WINDOWS_SDK_VERSION=$selectedSdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build native projects retargeted to VS2022 toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $targets = @(
            'NativeLib',
            'SiglusUniversalPatch',
            'PatchLoader',
            'Loader',
            'Omv2Avi',
            'ScriptRepacker',
            'SiglusExtract'
          ) -join ';'

          msbuild $env:SOLUTION_PATH `
            /m `
            /verbosity:minimal `
            "/t:$targets" `
            "/p:Configuration=$env:CONFIGURATION" `
            "/p:Platform=$env:PLATFORM" `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" `
            "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK_VERSION"

      - name: Build C# helper with installed .NET Framework targeting pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          msbuild source/SiglusExtract/SiglusExtractCfg/SiglusExtractCfg.csproj `
            /m `
            /verbosity:minimal `
            /p:Configuration=Release `
            /p:Platform=AnyCPU `
            /p:TargetFrameworkVersion=v4.8

      - name: Show build outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $paths = @(
            'source/SiglusExtract/Release',
            'source/SiglusExtract/SiglusExtract',
            'source/SiglusExtract/SiglusExtractCfg/bin/Release'
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "== $path =="
              Get-ChildItem $path -File -Recurse |
                Where-Object { $_.Extension -in '.exe', '.dll', '.pdb', '.json', '.config' } |
                Sort-Object FullName |
                Format-Table FullName, Length -AutoSize
            }
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SiglusExtract-Release-Win32-v3-no-installer
          if-no-files-found: error
          path: |
            source/SiglusExtract/Release/*.exe
            source/SiglusExtract/Release/*.dll
            source/SiglusExtract/Release/*.pdb
            source/SiglusExtract/SiglusExtract/*.exe
            source/SiglusExtract/SiglusExtract/*.dll
            source/SiglusExtract/SiglusExtract/*.pdb
            source/SiglusExtract/SiglusExtract/*.json
            source/SiglusExtract/SiglusExtractCfg/bin/Release/*
