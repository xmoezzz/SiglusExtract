name: SiglusExtract Windows CI v2

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release Win32
    runs-on: windows-2022

    env:
      SOLUTION_PATH: source/SiglusExtract/SiglusExtract.sln
      CONFIGURATION: Release
      PLATFORM: Win32

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install legacy Visual C++ v141 and MFC components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found: $vswhere"
          }

          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installPath) {
            throw 'No Visual Studio installation with MSBuild was found.'
          }

          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vs_installer.exe'
          if (-not (Test-Path $installer)) {
            throw "vs_installer.exe was not found: $installer"
          }

          $components = @(
            'Microsoft.VisualStudio.Component.VC.v141.x86.x64',
            'Microsoft.VisualStudio.Component.VC.v141.MFC'
          )

          $arguments = @(
            'modify',
            '--installPath', $installPath,
            '--quiet',
            '--norestart',
            '--nocache'
          )

          foreach ($component in $components) {
            $arguments += @('--add', $component)
          }

          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            throw "Visual Studio Installer failed with exit code $($process.ExitCode)."
          }

      - name: Select exact installed Windows SDK version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $kitsInclude = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          if (-not (Test-Path $kitsInclude)) {
            throw "Windows Kits include directory was not found: $kitsInclude"
          }

          $installedSdks = Get-ChildItem $kitsInclude -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'um\Windows.h') } |
            ForEach-Object { $_.Name } |
            Sort-Object

          if (-not $installedSdks) {
            throw "No usable Windows 10 SDK include directories were found under: $kitsInclude"
          }

          Write-Host 'Installed Windows SDKs:'
          $installedSdks | ForEach-Object { Write-Host "  $_" }

          $preferredSdks = @(
            '10.0.17763.0',
            '10.0.19041.0',
            '10.0.22621.0',
            '10.0.26100.0'
          )

          $selectedSdk = $preferredSdks | Where-Object { $installedSdks -contains $_ } | Select-Object -First 1
          if (-not $selectedSdk) {
            throw "None of the preferred Windows SDKs is installed. Installed SDKs: $($installedSdks -join ', ')"
          }

          Write-Host "Selected Windows SDK: $selectedSdk"
          "WINDOWS_SDK_VERSION=$selectedSdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build C++ projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $targets = @(
            'NativeLib',
            'SiglusUniversalPatch',
            'PatchLoader',
            'Loader',
            'Omv2Avi',
            'ScriptRepacker',
            'SiglusExtract'
          ) -join ';'

          msbuild $env:SOLUTION_PATH `
            /m `
            /verbosity:minimal `
            "/t:$targets" `
            "/p:Configuration=$env:CONFIGURATION" `
            "/p:Platform=$env:PLATFORM" `
            "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK_VERSION"

      - name: Build C# helper with modern .NET Framework targeting pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          msbuild source/SiglusExtract/SiglusExtractCfg/SiglusExtractCfg.csproj `
            /m `
            /verbosity:minimal `
            /p:Configuration=Release `
            /p:Platform=AnyCPU `
            /p:TargetFrameworkVersion=v4.8

      - name: Show build outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $paths = @(
            'source/SiglusExtract/Release',
            'source/SiglusExtract/SiglusExtract',
            'source/SiglusExtract/SiglusExtractCfg/bin/Release'
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "== $path =="
              Get-ChildItem $path -File -Recurse |
                Where-Object { $_.Extension -in '.exe', '.dll', '.pdb', '.json', '.config' } |
                Sort-Object FullName |
                Format-Table FullName, Length -AutoSize
            }
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SiglusExtract-Release-Win32-v2
          if-no-files-found: error
          path: |
            source/SiglusExtract/Release/*.exe
            source/SiglusExtract/Release/*.dll
            source/SiglusExtract/Release/*.pdb
            source/SiglusExtract/SiglusExtract/*.exe
            source/SiglusExtract/SiglusExtract/*.dll
            source/SiglusExtract/SiglusExtract/*.pdb
            source/SiglusExtract/SiglusExtract/*.json
            source/SiglusExtract/SiglusExtractCfg/bin/Release/*
